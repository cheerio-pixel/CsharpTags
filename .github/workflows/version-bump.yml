name: Version Bump

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: 'Prerelease label (leave empty for stable release)'
        required: false
        default: ''
        type: string

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Git
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
    
    - name: Get current version from Core project
      id: current_version
      run: |
        CURRENT_VERSION=$(grep -oP '(?<=<Version>)[^<]+' CsharpTags.Core/CsharpTags.Core.csproj)
        echo "Current version: $CURRENT_VERSION"
        echo "CURRENT_VERSION=$CURRENT_VERSION" >> $GITHUB_OUTPUT
    
    - name: Calculate new version
      id: new_version
      run: |
        CURRENT_VERSION="${{ steps.current_version.outputs.CURRENT_VERSION }}"
        VERSION_TYPE="${{ github.event.inputs.version_type }}"
        PRERELEASE="${{ github.event.inputs.prerelease }}"
        
        # Remove prerelease suffix if present
        BASE_VERSION=$(echo "$CURRENT_VERSION" | sed -E 's/-.*//')
        
        # Split version into parts
        MAJOR=$(echo "$BASE_VERSION" | cut -d. -f1)
        MINOR=$(echo "$BASE_VERSION" | cut -d. -f2)
        PATCH=$(echo "$BASE_VERSION" | cut -d. -f3)
        
        # Bump version
        case $VERSION_TYPE in
          major)
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
            ;;
          minor)
            MINOR=$((MINOR + 1))
            PATCH=0
            ;;
          patch)
            PATCH=$((PATCH + 1))
            ;;
        esac
        
        NEW_VERSION="$MAJOR.$MINOR.$PATCH"
        
        # Add prerelease suffix if provided
        if [ -n "$PRERELEASE" ]; then
          NEW_VERSION="$NEW_VERSION-$PRERELEASE"
        fi
        
        echo "New version: $NEW_VERSION"
        echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
    
    - name: Update version in all project files
      run: |
        NEW_VERSION="${{ steps.new_version.outputs.NEW_VERSION }}"
        
        # Update Core
        sed -i "s/<Version>.*<\/Version>/<Version>$NEW_VERSION<\/Version>/" CsharpTags.Core/CsharpTags.Core.csproj
        
        # Update Htmx
        sed -i "s/<Version>.*<\/Version>/<Version>$NEW_VERSION<\/Version>/" CsharpTags.Htmx/CsharpTags.Htmx.csproj
        
        # Update AspNetCore
        sed -i "s/<Version>.*<\/Version>/<Version>$NEW_VERSION<\/Version>/" CsharpTags.AspNetCore/CsharpTags.AspNetCore.csproj
        
        # Update Carter
        sed -i "s/<Version>.*<\/Version>/<Version>$NEW_VERSION<\/Version>/" CsharpTags.Carter/CsharpTags.Carter.csproj
        
        echo "Updated all projects to version $NEW_VERSION"
    
    - name: Commit version changes
      run: |
        NEW_VERSION="${{ steps.new_version.outputs.NEW_VERSION }}"
        git add -A
        git commit -m "Bump version to $NEW_VERSION"
        git push
    
    - name: Create and push tag
      run: |
        NEW_VERSION="${{ steps.new_version.outputs.NEW_VERSION }}"
        git tag -a "v$NEW_VERSION" -m "Release v$NEW_VERSION"
        git push origin "v$NEW_VERSION"
    
    - name: Output summary
      run: |
        echo "## Version Bumped Successfully!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Previous Version:** ${{ steps.current_version.outputs.CURRENT_VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo "**New Version:** ${{ steps.new_version.outputs.NEW_VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo "**Bump Type:** ${{ github.event.inputs.version_type }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "A new tag \\"v${{ steps.new_version.outputs.NEW_VERSION }}\\" has been created." >> $GITHUB_STEP_SUMMARY
        echo "The publish workflow will automatically trigger and publish to NuGet.org." >> $GITHUB_STEP_SUMMARY
