name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET 8.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --no-restore --configuration Release
    
    - name: Test
      run: dotnet test --no-build --verbosity normal
    
    - name: Pack NuGet Packages (dry run)
      run: |
        dotnet pack CsharpTags.Core/CsharpTags.Core.csproj --no-build --configuration Release --output ./packages
        dotnet pack CsharpTags.Htmx/CsharpTags.Htmx.csproj --no-build --configuration Release --output ./packages
        dotnet pack CsharpTags.AspNetCore/CsharpTags.AspNetCore.csproj --no-build --configuration Release --output ./packages
        dotnet pack CsharpTags.Carter/CsharpTags.Carter.csproj --no-build --configuration Release --output ./packages
    
    - name: Upload packages as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: ./packages/*.nupkg
